spring:
  application.name: amn-backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.example.amn
      auto-offset-reset: earliest
  lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
amn:
  input-file: ${INPUT_FILE:/data/Input.txt}
  output-file: ${OUTPUT_FILE:/data/Output.csv}
  checkpoint-file: ${CHECKPOINT_FILE:/data/Input.offset}
  topic: ${TRANSACTION_TOPIC:transactions}
  dlq-topic: ${DLQ_TOPIC:transactions.DLT}
  poll-ms: ${POLL_MS:1000}
