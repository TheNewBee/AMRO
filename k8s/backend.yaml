apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amn-amro-backend-data
  labels:
    app.kubernetes.io/name: amn-amro-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amn-amro-backend
  labels:
    app.kubernetes.io/name: amn-amro-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amn-amro-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amn-amro-backend
    spec:
      containers:
        - name: backend
          image: amn-amro/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: amn-amro-backend-config
          volumeMounts:
            - name: backend-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: amn-amro-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: amn-amro-backend
  labels:
    app.kubernetes.io/name: amn-amro-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amn-amro-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
