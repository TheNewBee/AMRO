apiVersion: v1
kind: ConfigMap
metadata:
  name: amn-amro-backend-config
  labels:
    app.kubernetes.io/name: amn-amro-backend
data:
  INPUT_FILE: /data/Input.txt
  OUTPUT_FILE: /data/Output.csv
  KAFKA_BOOTSTRAP_SERVERS: kafka.company.internal:9092
  TRANSACTION_TOPIC: amn-amro-transactions
  DLQ_TOPIC: amn-amro-transactions-dead-letter
