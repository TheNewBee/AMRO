apiVersion: apps/v1
kind: Deployment
metadata:
  name: amn-amro-frontend
  namespace: amn-amro
  labels:
    app.kubernetes.io/name: amn-amro-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amn-amro-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amn-amro-frontend
    spec:
      containers:
        - name: frontend
          image: amn-amro/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: amn-amro-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: amn-amro-frontend
  namespace: amn-amro
  labels:
    app.kubernetes.io/name: amn-amro-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amn-amro-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
